name: Build media

# Downloads your Etsy listing photos and turns them into reels + carousel
# slides (see content/build.yml), then commits them to media/.
# Open the finished run to see a preview of every reel and carousel.
on:
  push:
    paths: ["content/build.yml"]
  workflow_dispatch:
    inputs:
      only:
        description: "Only rebuild outputs whose path contains this (optional, e.g. chai)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: build-media
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Build reels and slides
        env:
          ONLY: ${{ inputs.only }}
        run: |
          args=()
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          python tools/build_media.py "${args[@]}"

      - name: Check against Instagram's rules
        run: python -m ig validate

      - name: Save media to the repo
        run: |
          git config user.name  "karvit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Build media from Etsy photos"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          echo "::error::Could not push media"; exit 1

      - name: Previews
        run: |
          sha=$(git rev-parse HEAD)
          {
            echo "## Previews"
            echo "Happy with them? In content/queue.yml delete the \`draft: true\` line of each post to make it live."
            for f in media/previews/*.jpg; do
              [ -e "$f" ] || continue
              echo "### $(basename "$f" .jpg)"
              echo "![$(basename "$f")](https://github.com/${GITHUB_REPOSITORY}/blob/${sha}/${f}?raw=true)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
