name: Check queue

# Runs whenever you change the queue or media, so mistakes show up as a red X
# on your commit instead of a failed post later.
on:
  push:
    paths: ["content/queue.yml", "media/**", "ig/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: python -m unittest discover -s tests -q
      - run: python -m ig validate
      - name: Upcoming posts
        run: python -m ig schedule >> "$GITHUB_STEP_SUMMARY"
