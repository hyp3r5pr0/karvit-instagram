# ─────────────────────────────────────────────────────────────────────────────
#  KARVIT Instagram queue
#  Add a post = put its file in media/ and add an entry under `posts:`.
#  Commit + push. The "Check queue" workflow validates it; "Publish to
#  Instagram" posts it at its time. Times are New York time (see settings).
#  `draft: true` = planned but not ready; it is never published.
#  `make:` = notes for building the media (ignored by the publisher).
# ─────────────────────────────────────────────────────────────────────────────

settings:
  timezone: America/New_York     # your buyers' clock; IST is 9.5h ahead (10.5h from 1 Nov)
  max_posts_per_run: 1
  min_gap_minutes: 120           # never two posts within 2 hours
  max_lateness_hours: 12         # if GitHub was down, don't post a 7 PM reel at 9 AM
  max_attempts: 3                # then stop retrying and flag it
  reel_upload: url               # url (official) | auto | resumable
  caption_footer: "🛒 Shop KARVIT on Etsy, link in bio"
  always_hashtags: [karvit, madetostandtall]

posts:
