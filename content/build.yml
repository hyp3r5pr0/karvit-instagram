# ─────────────────────────────────────────────────────────────────────────────
#  Media build list: turns your Etsy listing photos into reels and carousel
#  slides. Runs in GitHub Actions ("Build media" workflow) whenever this file
#  changes, then commits the results to media/ plus previews to media/previews/.
#
#  Photos are referenced by direct Etsy image link (i.etsystatic.com). The build
#  automatically fetches the highest-resolution version available.
#  To swap a photo: open the listing, right-click the photo → Copy image address,
#  paste it in place of the old link.
#
#  On-screen text: no emoji (the font can't draw them); emoji are fine in captions.
# ─────────────────────────────────────────────────────────────────────────────

