name: Refresh Instagram token

# Instagram long-lived tokens last 60 days. Renewing weekly means one missed
# run never matters. If this fails, GitHub emails you; fix within ~7 weeks.
on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC (08:47 IST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Renew and save token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}   # fine-grained PAT: "Secrets: read and write" on this repo only
        run: python -m ig refresh-token --update-secret
